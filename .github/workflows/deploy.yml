name: Deploy Rapyd Sentinel

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Format
      run: terraform fmt -check -recursive
      working-directory: ./terraform

    - name: Terraform Validate
      run: terraform validate
      working-directory: ./terraform

    - name: Terraform Plan
      run: terraform plan -no-color
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-infrastructure:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: validate-terraform
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Plan
      run: terraform plan -out=tfplan
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  validate-kubernetes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: deploy-infrastructure
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Check Infrastructure Exists
      run: |
        echo "Checking if EKS clusters exist..."
        aws eks describe-cluster --region us-west-2 --name eks-backend > /dev/null 2>&1
        if [ $? -ne 0 ]; then
          echo "Backend cluster not found - infrastructure deployment may have failed"
          exit 1
        fi
        aws eks describe-cluster --region us-west-2 --name eks-gateway > /dev/null 2>&1
        if [ $? -ne 0 ]; then
          echo "Gateway cluster not found - infrastructure deployment may have failed"
          exit 1
        fi
        echo "Infrastructure clusters found - proceeding with validation"

    - name: Validate Backend Manifests
      run: |
        aws eks update-kubeconfig --region us-west-2 --name eks-backend
        kubectl apply --dry-run=client -f kubernetes/backend/

    - name: Validate Gateway Manifests
      run: |
        aws eks update-kubeconfig --region us-west-2 --name eks-gateway
        kubectl apply --dry-run=client -f kubernetes/gateway/

  deploy-applications:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [deploy-infrastructure, validate-kubernetes]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Update kubeconfig for backend cluster
      run: |
        aws eks update-kubeconfig --region us-west-2 --name eks-backend

    - name: Deploy Backend Service
      run: |
        kubectl apply -f kubernetes/backend/

    - name: Wait for backend deployment
      run: |
        kubectl wait --for=condition=available --timeout=300s deployment/backend-service

    - name: Update kubeconfig for gateway cluster
      run: |
        aws eks update-kubeconfig --region us-west-2 --name eks-gateway

    - name: Deploy Gateway Proxy
      run: |
        kubectl apply -f kubernetes/gateway/

    - name: Wait for gateway deployment
      run: |
        kubectl wait --for=condition=available --timeout=300s deployment/gateway-proxy

    - name: Get LoadBalancer URL
      run: |
        echo "Waiting for LoadBalancer to be ready..."
        sleep 60
        LB_URL=$(kubectl get svc gateway-proxy -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        echo "LoadBalancer URL: http://$LB_URL"
        echo "LB_URL=$LB_URL" >> $GITHUB_ENV

    - name: Test connectivity
      run: |
        sleep 30
        curl -f http://$LB_URL || echo "Connection test failed - this is expected in some environments"
