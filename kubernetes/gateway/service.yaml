apiVersion: v1
kind: Service
metadata:
  name: gateway-proxy
  namespace: default
  labels:
    app: gateway-proxy
    environment: gateway
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: gateway-proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: gateway-proxy
  policyTypes:
  - Ingress
  ingress:
  - from: []
    ports:
    - protocol: TCP
      port: 80
